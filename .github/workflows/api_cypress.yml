name: Cypress Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        run: npm test

      - name: Upload Cypress JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-json-results
          path: cypress/reports/html/.jsons/


  report:
    runs-on: ubuntu-latest

    needs: tests

    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Cypress JSON Results
        uses: actions/download-artifact@v4
        with:
          name: cypress-json-results
          path: cypress/reports/html/.jsons/

      - name: Generate Mochawesome Report
        run: npx mochawesome-merge "cypress/reports/html/.jsons/*.json" > cypress/reports/html/report.json

      - name: Generate HTML Report
        run: npx marge cypress/reports/html/report.json -f cypress-report -o cypress/reports/html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports/html/